<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vuoi venire?</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }
        h1 {
            color: #d32f2f;
            font-size: 2rem;
            margin-bottom: 50px;
        }
        .box {
            position: relative;
            width: 100%;
            height: 150px;
        }
        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #yesBtn {
            background-color: #4CAF50;
            color: white;
            position: absolute;
            left: 30%;
            transform: translateX(-50%);
        }
        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
            left: 70%;
            transform: translateX(-50%);
        }
        #message {
            display: none;
            font-size: 2.5rem;
            color: #d32f2f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1 id="question">Vuoi venire?</h1>
    
    <div class="box" id="area">
        <button id="yesBtn" onclick="ok()">Sì</button>
        <button id="noBtn" onmouseover="scappa()" ontouchstart="scappa()" onclick="scappa()">No</button>
    </div>

    <div id="message">Evviva! 🎉❤️</div>

    <script>
        function scappa() {
            const btn = constNo = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 200);
            constNo.style.left = x + 'px';
            constNo.style.top = y + 'px';
        }

        function ok() {
            document.getElementById('question').style.display = 'none';
            document.getElementById('area').style.display = 'none';
            document.getElementById('message').style.display = 'block';
        }
    </script>
</body>
</html>
